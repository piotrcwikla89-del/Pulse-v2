# Blueprint Render — Web Service + Postgres.
# Dashboard: New → Blueprint → ten plik, albo utwórz usługi ręcznie według README poniżej.
services:
  - type: web
    name: pulse-v2
    runtime: python
    plan: starter
    # Aptfile instaluje tesseract-ocr (wymagany do skanów PDF bez warstwy tekstowej).
    buildCommand: pip install -r requirements.txt
    # 3 workery + max-requests: OCR nie może zablokować całego serwisu / healthchecka.
    startCommand: gunicorn -w 3 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --timeout 90 --graceful-timeout 20 --max-requests 80 --max-requests-jitter 20
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Europe/Warsaw
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-v2-db
          property: connectionString

databases:
  - name: pulse-v2-db
    plan: basic-256mb
    databaseName: pulse
    user: pulse
