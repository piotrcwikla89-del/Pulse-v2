# Blueprint Render — Web Service + Background Worker (OCR) + Postgres.
services:
  - type: web
    name: pulse-v2
    runtime: python
    plan: starter
    # Aptfile instaluje tesseract-ocr (wymagany do skanów PDF bez warstwy tekstowej).
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --timeout 180 --graceful-timeout 30
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Europe/Warsaw
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-v2-db
          property: connectionString

  # Ciężkie OCR/miniatury poza HTTP — nie blokuje UI ani healthchecka.
  - type: worker
    name: pulse-v2-ocr
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m services.planner.ocr_worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: OCR_WORKER_SLEEP
        value: "8"
      - key: OCR_WORKER_LIMIT
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-v2-db
          property: connectionString

databases:
  - name: pulse-v2-db
    plan: basic-256mb
    databaseName: pulse
    user: pulse
